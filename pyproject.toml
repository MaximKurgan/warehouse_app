[project]
name = "sklad-proga"
version = "0.1.0"
description = "Складской учет"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MaximKurgan" }
]
dependencies = [
    "flet>=1.0.1"
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.1",
    "flet-desktop>=1.0.1",
    "flet-web>=1.0.1",
    "flet[test]>=1.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "ru.maximkurgan"
product = "sklad-proga"
company = "MaximKurgan"
copyright = "Copyright 2026 MaximKurgan"

[tool.flet.app]
path = "src"
